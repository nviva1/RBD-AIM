[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rbdaim-classifier"
version = "1.0.0"
description = "SARS-CoV-2 RBD antibody epitope classifier (AntiBERTy paired-chain NN-model) from Terekhov et al., Nat. Commun. 2026."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nikita V. Ivanisenko", email = "n.ivanisenko@instadeep.com" },
]
keywords = ["antibody", "epitope", "antiberty", "sars-cov-2", "protein-language-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    # Pinned exactly, not >=. antiberty 1.0.0 is a restructured release that
    # ships no `trained_models/` directory, so `AntiBERTy.from_pretrained` gets
    # a non-existent path, transformers falls back to treating it as a Hub repo
    # id, and every model construction dies in HFValidationError. The published
    # RBD-AIM checkpoints were trained against 0.1.3's layout.
    "antiberty==0.1.3",
    # AntiBERTy targets the transformers 4.x API; 5.x removed BertModel
    # internals it relies on (e.g. all_tied_weights_keys). Pin until it ports.
    "transformers>=4.30,<5",
    "abnumber>=0.3",
    "scikit-learn>=1.3",
    # >=0.23, not >=0.18: rbdaim.schema imports `pandera.pandas`, the split
    # namespace introduced in 0.23. An older resolve imports cleanly at the
    # top level and then dies on that submodule. CI pins via the lockfile, so
    # only a plain `pip install` ever sees this.
    "pandera>=0.23",
    "hydra-core>=1.3",
    "structlog>=24.1",
    "huggingface-hub>=0.23",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Raw-sequence numbering for `rbdaim predict`. NOT required for training,
# scoring, or predicting from pre-numbered dataset rows.
#
# `anarci` is on PyPI, but it is only a wrapper: it shells out to `hmmscan`
# from HMMER, a C program that is not pip-installable. So this extra alone is
# not enough -- you also need HMMER from conda/apt/brew. `anarcii` is the
# pure-Python (PyTorch) reimplementation and needs no external binary, which
# is why it is the one that makes a plain `pip install` self-sufficient.
predict = ["anarci>=2026.2"]
predict-nohmmer = ["anarcii>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "pandas-stubs",
    "types-tqdm",
]

[project.urls]
Homepage = "https://github.com/nviva1/RBD-AIM"
Repository = "https://github.com/nviva1/RBD-AIM"
Issues = "https://github.com/nviva1/RBD-AIM/issues"
Paper = "https://www.nature.com/articles/s41467-026-70553-6"
Weights = "https://huggingface.co/nviva1/rbd-aim-epitope"

[project.scripts]
rbdaim = "rbdaim.cli:main"

# conf/ lives inside the package directory, so it ships in the wheel
# automatically and `pip install rbdaim-classifier` gives a CLI that can compose
# its own defaults. A checkout's ./conf still wins at runtime. CI asserts the
# built wheel contains it.
[tool.hatch.build.targets.wheel]
packages = ["src/rbdaim"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
# D203/D213: pick one of each mutually incompatible pair.
# D105/D107: dunders and __init__ are documented by the class docstring.
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; grouping classes need no docstring.
"tests/*" = ["D100", "D101", "D102", "D103"]
"scripts/*" = ["D100"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["antiberty.*", "abnumber.*", "transformers.*", "sklearn.*", "pandera.*"]
ignore_missing_imports = true

# Tests are checked, but not forced to annotate every `def test_x()` with
# `-> None`; the signal-to-noise of that rule in a test suite is poor.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
# Tests assert on values the type checker sees as Optional (a FoldResult's
# predictions are None only for full_model runs, which these tests do not use).
warn_unused_ignores = false
disable_error_code = ["union-attr", "arg-type", "operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rbdaim --cov-report=term-missing --cov-fail-under=75"
markers = [
    # Tests needing a dependency or artifact that a plain `pip install` does not
    # provide — currently ANARCI (bioconda). Deselected in CI with
    # `-m "not slow"`; run them locally with `make test-all`.
    #
    # AntiBERTy weights are NOT in this category: they ship inside the
    # antiberty wheel, so tests that build a real model run everywhere.
    "slow: requires an out-of-band dependency (ANARCI) or external artifact",
]
